name: AI Label Engine

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run label engine
        run: python ai_label_engine.py

      - name: Upload labels database
        uses: actions/upload-artifact@v4
        with:
          name: ai-labels-database
          path: ai_labels_database.json
