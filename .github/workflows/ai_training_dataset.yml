name: AI Training Dataset & Alerts Pipeline

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '30 15 * * 1-5' # يمكنك تفعيل الجدولة الزمنية لاحقاً إذا أردت

permissions:
  contents: read

jobs:
  build-dataset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas scikit-learn joblib xgboost requests

      - name: Build AI Features
        run: python ai_feature_engine.py

      - name: Build AI Labels
        run: python ai_label_engine.py

      - name: Build Market Regime
        run: python ai_market_regime.py

      - name: Build Training Dataset
        run: python ai_training_dataset.py

      - name: Analyze Training Dataset
        run: python ai_dataset_analysis.py

      - name: Train AI Model
        run: python ai_model_train.py

      # 🤖 الخطوة الجديدة: تشغيل التنبؤ والتليجرام وإدارة الصفقات
      - name: Run AI Prediction and Telegram Alerts
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python ai_predict_and_alert.py

      - name: Upload AI Dataset, Model and Results
        uses: actions/upload-artifact@v4
        with:
          name: ai-training-analysis-and-trades
          path: |
            ai_training_dataset.json
            ai_dataset_analysis_report.json
            ai_stock_model.pkl
            ai_trades.json
            ai_last_signals.json
