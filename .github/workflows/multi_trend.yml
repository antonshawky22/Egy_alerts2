name: multi_trend

on:
  workflow_dispatch:

  schedule:
    - cron: '30 04 * * 0-4'  # 12
    - cron: '40 07 * * 0-4'  # 13

permissions:
  contents: write

concurrency:
  group: multi-trend-group
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1️⃣ Checkout Repository
      # ==========================================
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      # ==========================================
      # 2️⃣ Python
      # ==========================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ==========================================
      # 3️⃣ Dependencies
      # ==========================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance tradingview-ta requests pandas curl_cffi

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      # ==========================================
      # 4️⃣ تحديث قاعدة الأسعار
      # ==========================================
      - name: Update Price Database
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python update_database.py

      # ==========================================
      # 5️⃣ تشغيل استراتيجية Multi Trend
      # ==========================================
      - name: Run Trading Strategies
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python multi-trend.py

      # ==========================================
      # 6️⃣ Commit + Pull + Push
      # ==========================================
      - name: Commit and Push Updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "📦 Staging generated files..."

          git add \
            last_signals.json \
            egx_history_database_v2.json

          # إضافة trades.json فقط إذا كان موجودًا
          if [ -f trades.json ]; then
            git add trades.json
          fi

          # ==========================================
          # لا توجد تغييرات
          # ==========================================
          if git diff --cached --quiet; then
            echo "ℹ️ No changes detected."
            echo "GITHUB_PUSH_DONE=false" >> "$GITHUB_ENV"
            exit 0
          fi

          # ==========================================
          # إنشاء Commit
          # ==========================================
          echo "💾 Creating commit..."

          git commit -m "Update database v2, signals and trades log [auto]"

          # ==========================================
          # مزامنة آخر نسخة من GitHub
          # ==========================================
          echo "🔄 Syncing with latest remote Main..."

          git pull --rebase origin Main

          # ==========================================
          # Push
          # ==========================================
          echo "🚀 Pushing updates to GitHub..."

          git push origin HEAD:Main

          # ==========================================
          # تسجيل أن Push نجح فعليًا
          # ==========================================
          echo "GITHUB_PUSH_DONE=true" >> "$GITHUB_ENV"

          echo "✅ GitHub push completed successfully."

      # ==========================================
      # 7️⃣ Telegram Confirmation
      #    يتم الإرسال فقط بعد Git Push فعلي
      # ==========================================
      - name: Send GitHub Save Confirmation
        if: success() && env.GITHUB_PUSH_DONE == 'true'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ.get("TELEGRAM_TOKEN")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID")

          if not token or not chat_id:
              print("⚠️ Telegram credentials are missing.")
              raise SystemExit(1)

          message = (
              "✅ تم تحديث أسعار البورصة بنجاح\n"
              "💾 تم حفظ قاعدة الأسعار وملفات استراتيجية Multi Trend بنجاح في GitHub"
          )

          url = f"https://api.telegram.org/bot{token}/sendMessage"

          response = requests.post(
              url,
              json={
                  "chat_id": chat_id,
                  "text": message
              },
              timeout=10
          )

          response.raise_for_status()

          print("✅ Final GitHub confirmation sent to Telegram.")
          PY
