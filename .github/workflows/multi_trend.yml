name: multi_trend

on:
  workflow_dispatch:

  schedule:
    - cron: '30 09 * * *'  # 12
    - cron: '30 10 * * *'  # 13

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 🟢 تم إضافة مكتبة curl_cffi هنا ليتوافق مع تحديث ياهو فاينانس الأخير
          pip install yfinance tradingview-ta requests pandas curl_cffi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 1️⃣ تشغيل سكريبت تحديث الأسعار أولاً وبناء ملف الـ json
      - name: Update Price Database
        run: python update_database.py

      # 2️⃣ تشغيل سكريبت الاستراتيجية وإرسال التليجرام بناءً على الملف الجاهز
      - name: Run Trading Strategies 
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python multi-trend.py

      # 3️⃣ حفظ قاعدة البيانات الجديدة وملف الإشارات وملف سجل الصفقات داخل الريبو
      - name: Commit database and last signals
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # 🟢 إضافة ملف trades.json هنا ليتم تتبعه وحفظه داخل الريبو بنجاح مع باقي الملفات
          git add last_signals.json egx_history_database_v2.json trades.json
          git diff --cached --quiet || git commit -m "Update database v2, signals and trades log [auto]"
          git push
