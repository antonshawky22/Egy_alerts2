name: AI Feature Engine

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  features:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run feature engine
        run: python ai_feature_engine.py

      - name: Upload feature database
        uses: actions/upload-artifact@v4
        with:
          name: ai-features-database
          path: ai_features_database.json
