name: weekly_database_update

on:
  workflow_dispatch: # للتشغيل اليدوي في أي وقت للتحقق والاختبار

  schedule:
    # تشغيل تلقائي كل يوم جمعة الساعة 6:00 مساءً بتوقيت مصر (15:00 UTC) بعد إغلاق الأسبوع
    - cron: '0 15 * * 5'

# 🔒 منح صلاحيات الكتابة للبوت لحفظ الملفات
permissions:
  contents: write

# 🔒 حماية لمنع التعارض إذا اشتغل الوركفلو مرتين في نفس الوقت
concurrency:
  group: weekly-strategy-group
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance tradingview-ta requests pandas curl_cffi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 1️⃣ تشغيل سكريبت تحديث الأسعار الأسبوعية
      - name: Update Weekly Price Database
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python update_database_weekly.py

      # 2️⃣ تشغيل سكريبت الاستراتيجية (معطل مؤقتاً لحين ربط كود الاستراتيجية)
      # - name: Run Weekly Trading Strategy 
      #   env:
      #     TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      #     TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      #   run: python weekly_strategy.py

      # 3️⃣ الحفظ التلقائي لقاعدة البيانات الأسبوعية في GitHub
      - name: Commit Weekly Database
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # سحب أي تعديلات قديمة لتجنب التعارض
          git pull origin HEAD --rebase || true

          # إضافة ملف قاعدة البيانات الأسبوعية الجديد
          git add egx_weekly_database_v1.json
          
          # التحقق من وجود تغييرات ثم رفعها
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update: Weekly Database v1 [skip ci]"
            git push origin HEAD
            echo "✅ Weekly Database successfully saved to GitHub!"
          else
            echo "ℹ️ No changes detected in weekly database to commit."
          fi
