name: AI Lab - Kronos EGX Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kronos-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: model/model.safetensors
          key: ${{ runner.os }}-kronos-weights-v1

      - name: Download Model Weights automatically
        run: |
          python -c "
          from huggingface_hub import hf_hub_download
          import os
          if not os.path.exists('model/model.safetensors'):
              print('Downloading model weights...')
              os.makedirs('model', exist_ok=True)
              hf_hub_download(repo_id='NeoQuasar/Kronos-small', filename='model.safetensors', local_dir='model')
          else:
              print('Model weights found in cache.')
          "

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install Kronos dependencies
        run: |
          pip install "numpy<2" pandas==2.2.2 einops==0.8.1 huggingface_hub==0.33.1 safetensors==0.6.2 tqdm==4.67.1

      - name: Run isolated EGX test
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE"
          python ai_lab_kronos_test.py

      - name: Upload Kronos test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-lab-kronos-results
          path: ai_lab_kronos_results.csv
          if-no-files-found: warn
          retention-days: 14
