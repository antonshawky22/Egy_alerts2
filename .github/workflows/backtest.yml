name: Multi Trend Backtest

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pandas numpy

      - name: Run Backtest
        run: |
          python backtest_multi_trend.py

      - name: Save Results to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add backtest_results.json backtest_trades.json backtest_summary_by_stock.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update multi-trend backtest results"
            git push
          fi
