name: multi_trend

on:
  workflow_dispatch:

  schedule:
    - cron: '00 00 * * *'  # 3.00 صباحًا بتوقيت مصر
    - cron: '00 01 * * *'  # 4.00 صباحًا بتوقيت مصر

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance tradingview-ta requests pandas
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 1️⃣ تشغيل سكريبت تحديث الأسعار أولاً وبناء ملف الـ json
      - name: Update Price Database
        run: python update_database.py

      # 2️⃣ تشغيل سكريبت الاستراتيجية وإرسال التليجرام بناءً على الملف الجاهز
      - name: Run Trading Strategies 
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python multi-trend.py

      # 3️⃣ التعديل السحري: حفظ قاعدة البيانات وملف الإشارات معاً داخل الريبو
      - name: Commit database and last signals
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # تم تعديل هذا السطر ليقوم بعمل حفظ للملفين معاً
          git add last_signals.json egx_history_database.json
          git diff --cached --quiet || git commit -m "Update database and signals [auto]"
          git push
