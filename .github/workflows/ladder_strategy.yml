name: ladder_strategy

on:
  workflow_dispatch:

  schedule:
    - cron: '10 08 * * 0-4'
    - cron: '20 11 * * 0-4'

permissions:
  contents: write

concurrency:
  group: ladder-strategy-group
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # Checkout Repository
      # ==========================================
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      # ==========================================
      # Python
      # ==========================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ==========================================
      # Dependencies
      # ==========================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance tradingview-ta requests pandas curl_cffi

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      # ==========================================
      # 1️⃣ تحديث قاعدة الأسعار
      # ==========================================
      - name: Update Price Database
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python update_database.py

      # ==========================================
      # 2️⃣ تشغيل استراتيجية السلم
      # ==========================================
      - name: Run Trading Strategies
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python second-strategy.py

      # ==========================================
      # 3️⃣ حفظ الملفات المحدثة في GitHub
      # ==========================================
      - name: Commit database and strategy state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "📦 Staging generated files..."

          git add \
            last_signals_strat2.json \
            egx_history_database_v2.json \
            trades2.json

          # ==========================================
          # التحقق من وجود تغييرات
          # ==========================================
          if git diff --cached --quiet; then
            echo "ℹ️ No changes detected."
            exit 0
          fi

          # ==========================================
          # إنشاء Commit محلي
          # ==========================================
          echo "💾 Creating commit..."

          git commit -m "Auto-update: Database v2, Ladder Strategy Signals & Trades History [skip ci]"

          # ==========================================
          # مزامنة آخر نسخة من GitHub
          # ==========================================
          echo "🔄 Syncing with latest remote Main..."

          git pull --rebase origin Main

          # ==========================================
          # رفع التحديثات
          # ==========================================
          echo "🚀 Pushing changes..."

          git push origin HEAD:Main

          echo "✅ Successfully saved all generated files!"
