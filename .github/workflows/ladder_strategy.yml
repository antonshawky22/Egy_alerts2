name: ladder_strategy

on:
  workflow_dispatch:

  schedule:
    - cron: '10 08 * * 0-4'  # الساعة 11:10 صباحاً بتوقيت مصر
    - cron: '10 10 * * 0-4'  # الساعة 1:10 ظهراً بتوقيت مصر

# 🔒 منح صلاحيات الكتابة للبوت لحفظ الملفات
permissions:
  contents: write

# 🔒 حماية لمنع التعارض إذا اشتغل الوركفلو مرتين في نفس الوقت
concurrency:
  group: ladder-strategy-group
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance tradingview-ta requests pandas curl_cffi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 1️⃣ تشغيل سكريبت تحديث الأسعار
      - name: Update Price Database
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python update_database.py

      # 2️⃣ تشغيل سكريبت استراتيجية السلم
      - name: Run Trading Strategies 
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python second-strategy.py

      # 3️⃣ الحفظ التلقائي وإرسال التنبيهات المؤكدة
      - name: Commit database and last signals
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # سحب أي تعديلات قديمة لتجنب المشاكل
          git pull origin HEAD --rebase || true

          # إضافة الملفات المحدثة (تضمين ملف السجل الجديد trades2.json)
          git add last_signals_strat2.json egx_history_database_v2.json trades2.json
          
          # التحقق من وجود تغييرات ثم رفعها
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update: Database v2, Ladder Strategy Signals & Trades History [skip ci]"
            git push origin HEAD
            echo "✅ State, signals, and trades history successfully saved to GitHub!"
          else
            echo "ℹ️ No changes detected in files to commit."
          fi
