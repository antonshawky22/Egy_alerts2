name: ladder_strategy

on:
  workflow_dispatch:

  schedule:
    - cron: '10 08 * * 0-4'  # 12
    - cron: '10 10 * * 0-4'  # 13

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance tradingview-ta requests pandas curl_cffi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 1️⃣ تشغيل سكريبت تحديث الأسعار أولاً وبناء ملف الـ json المشترك
      - name: Update Price Database
        run: python update_database.py

      # 2️⃣ تشغيل سكريبت استراتيجية السلم وإرسال التليجرام بناءً على الملف الجاهز
      - name: Run Trading Strategies 
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python second-strategy.py

      # 3️⃣ حفظ قاعدة البيانات المشتركة وملف إشارات السلم الجديد داخل الريبو
      - name: Commit database and last signals
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # تم تعديل السطر ليحفظ ملف إشارات السلم الجديد last_signals_strat2.json وقاعدة البيانات المشتركة
          git add last_signals_strat2.json egx_history_database_v2.json
          git diff --cached --quiet || git commit -m "Update database v2 and ladder signals [auto]"
          git push
